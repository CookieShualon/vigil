<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Vigil</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:            #0c0c0c;
    --surface:       #111111;
    --surface-hi:    #161616;
    --surface2:      #141414;
    --border:        #1e1e1e;
    --border-hi:     #2a2a2a;
    --text:          #e8e8e8;
    --muted:         #555555;
    --muted2:        #888888;
    --accent:        #c8ff00;
    --running:       #4a9eff;
    --done:          #4ade80;
    --failed:        #f87171;
    --queue:         #888888;
  }

  html, body { height: 100%; overflow: hidden; }

  body {
    font-family: 'JetBrains Mono', monospace;
    background: var(--bg);
    color: var(--text);
    font-size: 13px;
    display: flex;
    -webkit-font-smoothing: antialiased;
  }

  /* ─── Sidebar ──────────────────────────────────────────── */
  #sidebar {
    width: 220px;
    min-width: 220px;
    background: var(--surface);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    padding: 20px 16px 16px;
    gap: 0;
  }

  .sidebar-section {
    display: flex;
    flex-direction: column;
    gap: 7px;
    margin-bottom: 18px;
  }

  .sidebar-label {
    font-size: 10px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.09em;
  }

  select {
    appearance: none;
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: inherit;
    font-size: 11px;
    padding: 6px 8px;
    border-radius: 4px;
    width: 100%;
    cursor: pointer;
    outline: none;
    transition: border-color 120ms;
  }
  select:focus { border-color: var(--accent); }

  .range-row { display: flex; align-items: center; gap: 8px; }
  .range-row input[type=range] {
    flex: 1;
    accent-color: var(--accent);
    cursor: pointer;
    height: 3px;
  }
  #max-steps-val {
    font-size: 11px;
    color: var(--accent);
    min-width: 22px;
    text-align: right;
    font-variant-numeric: tabular-nums;
  }

  #btn-new {
    margin-top: auto;
    background: var(--accent);
    color: #000;
    border: none;
    padding: 8px 12px;
    font-family: inherit;
    font-size: 12px;
    font-weight: 700;
    border-radius: 4px;
    cursor: pointer;
    width: 100%;
    letter-spacing: 0.02em;
    transition: opacity 150ms;
  }
  #btn-new:hover { opacity: 0.82; }

  /* ─── Main ─────────────────────────────────────────────── */
  #main {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    min-width: 0;
  }

  /* ─── Topbar ────────────────────────────────────────────── */
  #topbar {
    height: 44px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    padding: 0 20px;
    gap: 20px;
    flex-shrink: 0;
  }

  #app-title {
    font-size: 13px;
    font-weight: 700;
    color: var(--accent);
    letter-spacing: 0.04em;
    flex-shrink: 0;
  }

  #tabs {
    display: flex;
    height: 100%;
    gap: 2px;
  }

  .tab {
    background: none;
    border: none;
    border-bottom: 2px solid transparent;
    color: var(--muted);
    font-family: inherit;
    font-size: 12px;
    padding: 0 12px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 6px;
    height: 100%;
    margin-bottom: -1px;
    transition: color 150ms;
    white-space: nowrap;
  }
  .tab:hover { color: var(--muted2); }
  .tab.active {
    color: var(--text);
    border-bottom-color: var(--accent);
  }

  .tab-badge {
    font-size: 10px;
    padding: 1px 5px;
    border-radius: 9px;
    background: var(--border);
    color: var(--muted);
    font-variant-numeric: tabular-nums;
    min-width: 18px;
    text-align: center;
    transition: background 150ms, color 150ms;
  }
  .tab.active .tab-badge {
    background: rgba(200,255,0,0.14);
    color: var(--accent);
  }

  /* ─── Card area / Panes ─────────────────────────────────── */
  #card-area {
    flex: 1;
    position: relative;
    overflow: hidden;
  }

  .tab-pane {
    position: absolute;
    inset: 0;
    overflow-y: auto;
    padding: 10px 14px;
    display: none;
    flex-direction: column;
    gap: 5px;
  }
  .tab-pane.active { display: flex; }

  .tab-pane::-webkit-scrollbar { width: 4px; }
  .tab-pane::-webkit-scrollbar-track { background: transparent; }
  .tab-pane::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  /* ─── Cards ─────────────────────────────────────────────── */
  .card {
    position: relative;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 10px 12px 10px 22px;
    cursor: pointer;
    overflow: hidden;
    transition: background 100ms, border-color 100ms;
    flex-shrink: 0;
  }
  .card:hover {
    background: var(--surface-hi);
    border-color: var(--border-hi);
  }
  .card.dragging { opacity: 0.3; }

  /* status dot — left edge, vertically centered */
  .card::before {
    content: '';
    position: absolute;
    left: 9px;
    top: 50%;
    transform: translateY(-50%);
    width: 6px;
    height: 6px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .card[data-status="queue"]::before   { background: var(--queue); }
  .card[data-status="running"]::before { background: var(--running); animation: pulse 1.6s ease-in-out infinite; }
  .card[data-status="done"]::before    { background: var(--done); }
  .card[data-status="failed"]::before  { background: var(--failed); }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50%       { opacity: 0.2; }
  }

  .card-desc {
    font-size: 12px;
    font-weight: 500;
    color: var(--text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    line-height: 1.3;
    margin-bottom: 4px;
  }

  .card-meta {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 3px;
  }
  .card-model  { font-size: 10px; color: var(--muted); }
  .card-steps  { font-size: 10px; color: var(--accent); font-variant-numeric: tabular-nums; }
  .card-elapsed-inline {
    font-size: 10px;
    color: var(--muted);
    margin-left: auto;
    font-variant-numeric: tabular-nums;
  }

  .card-log {
    font-size: 10px;
    color: var(--muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    line-height: 1.3;
  }

  /* progress bar — 2px, bottom of card, running only */
  .card-progress {
    position: absolute;
    bottom: 0;
    left: 0;
    height: 2px;
    background: var(--accent);
    opacity: 0.75;
    border-radius: 0 0 6px 6px;
    transition: width 350ms ease;
    pointer-events: none;
  }

  /* drop target highlight */
  .tab-pane.drop-over { outline: 1px dashed rgba(200,255,0,0.25); outline-offset: -6px; border-radius: 6px; }

  /* empty state */
  .empty-state {
    font-size: 11px;
    color: var(--border);
    text-align: center;
    padding-top: 44px;
    letter-spacing: 0.05em;
    user-select: none;
  }

  /* ─── Modal ─────────────────────────────────────────────── */
  #modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.65);
    z-index: 100;
    align-items: center;
    justify-content: center;
    backdrop-filter: blur(3px);
  }
  #modal-overlay.open { display: flex; }

  #modal {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 22px;
    width: 460px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  #modal h2 {
    font-size: 10px;
    font-weight: 700;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.09em;
  }

  #modal textarea {
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: inherit;
    font-size: 12px;
    padding: 10px;
    border-radius: 4px;
    resize: vertical;
    min-height: 76px;
    width: 100%;
    line-height: 1.55;
    outline: none;
    transition: border-color 120ms;
  }
  #modal textarea:focus { border-color: var(--accent); }

  .modal-row   { display: flex; gap: 10px; }
  .modal-field { flex: 1; display: flex; flex-direction: column; gap: 6px; }
  .modal-field label {
    font-size: 10px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.09em;
  }

  .modal-actions {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 8px;
  }

  .modal-hint {
    font-size: 10px;
    color: var(--muted);
    margin-right: auto;
  }

  .btn-ghost {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--muted);
    font-family: inherit;
    font-size: 11px;
    padding: 7px 14px;
    border-radius: 4px;
    cursor: pointer;
    transition: border-color 120ms, color 120ms;
  }
  .btn-ghost:hover { border-color: var(--border-hi); color: var(--text); }

  .btn-accent {
    background: var(--accent);
    color: #000;
    border: none;
    font-family: inherit;
    font-size: 11px;
    font-weight: 700;
    padding: 7px 14px;
    border-radius: 4px;
    cursor: pointer;
    transition: opacity 120ms;
  }
  .btn-accent:hover { opacity: 0.82; }

  /* ─── Detail Panel ──────────────────────────────────────── */
  #detail-panel {
    position: fixed;
    top: 0;
    right: -480px;
    width: 480px;
    height: 100%;
    background: var(--surface);
    border-left: 1px solid var(--border);
    z-index: 50;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    transition: right 230ms cubic-bezier(0.4, 0, 0.2, 1);
  }
  #detail-panel.open { right: 0; }

  #detail-header {
    height: 44px;
    padding: 0 18px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 9px;
    flex-shrink: 0;
  }

  #detail-id {
    font-size: 12px;
    font-weight: 700;
    color: var(--accent);
    letter-spacing: 0.03em;
  }

  /* status badge — inline pill */
  #detail-title {
    font-size: 10px;
    padding: 2px 7px;
    border-radius: 9px;
    font-weight: 500;
    letter-spacing: 0.03em;
  }
  #detail-title.badge-queue   { background: rgba(136,136,136,0.12); color: var(--queue); }
  #detail-title.badge-running { background: rgba(74,158,255,0.12);  color: var(--running); }
  #detail-title.badge-done    { background: rgba(74,222,128,0.12);  color: var(--done); }
  #detail-title.badge-failed  { background: rgba(248,113,113,0.12); color: var(--failed); }

  #detail-close {
    margin-left: auto;
    background: none;
    border: none;
    color: var(--muted);
    font-size: 15px;
    cursor: pointer;
    padding: 0;
    line-height: 1;
    transition: color 120ms;
  }
  #detail-close:hover { color: var(--text); }

  #detail-body {
    flex: 1;
    overflow-y: auto;
    padding: 16px 18px;
    display: flex;
    flex-direction: column;
    gap: 18px;
  }
  #detail-body::-webkit-scrollbar { width: 4px; }
  #detail-body::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  .detail-label {
    font-size: 10px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.09em;
    margin-bottom: 7px;
  }

  #detail-desc {
    font-size: 12px;
    line-height: 1.6;
    color: var(--text);
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 10px 12px;
  }

  /* live browser */
  .browser-inset {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 80px;
  }

  #live-screenshot {
    width: 100%;
    display: none;
    object-fit: contain;
    border-radius: 6px;
  }

  #no-screenshot {
    font-size: 11px;
    color: var(--muted);
    padding: 32px;
    text-align: center;
  }

  /* history */
  #detail-history {
    display: flex;
    flex-direction: column;
    gap: 3px;
    max-height: 240px;
    overflow-y: auto;
  }
  #detail-history::-webkit-scrollbar { width: 4px; }
  #detail-history::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  .history-row {
    display: flex;
    gap: 10px;
    font-size: 11px;
    padding: 4px 8px;
    border-radius: 3px;
    background: var(--bg);
    transition: background 100ms;
  }
  .history-row:hover { background: var(--surface2); }
  .history-time   { color: var(--accent); font-variant-numeric: tabular-nums; flex-shrink: 0; }
  .history-action { color: var(--muted2); word-break: break-all; }

  #detail-error {
    font-size: 11px;
    color: var(--failed);
    background: rgba(248,113,113,0.06);
    border: 1px solid rgba(248,113,113,0.14);
    border-radius: 4px;
    padding: 9px 10px;
    display: none;
    line-height: 1.5;
  }

  /* panel action bar */
  #detail-actions {
    display: flex;
    gap: 8px;
    padding: 11px 18px;
    border-top: 1px solid var(--border);
    flex-shrink: 0;
  }

  #btn-stop {
    background: transparent;
    border: 1px solid rgba(248,113,113,0.25);
    color: var(--failed);
    font-family: inherit;
    font-size: 11px;
    font-weight: 500;
    padding: 7px 14px;
    border-radius: 4px;
    cursor: pointer;
    transition: background 120ms, border-color 120ms;
  }
  #btn-stop:hover {
    background: rgba(248,113,113,0.07);
    border-color: rgba(248,113,113,0.45);
  }

  #btn-retry {
    background: transparent;
    border: 1px solid rgba(200,255,0,0.22);
    color: var(--accent);
    font-family: inherit;
    font-size: 11px;
    font-weight: 500;
    padding: 7px 14px;
    border-radius: 4px;
    cursor: pointer;
    transition: background 120ms, border-color 120ms;
  }
  #btn-retry:hover {
    background: rgba(200,255,0,0.07);
    border-color: rgba(200,255,0,0.45);
  }
</style>
</head>
<body>

<!-- Sidebar -->
<aside id="sidebar">
  <div class="sidebar-section">
    <span class="sidebar-label">Model</span>
    <select id="model-select">
      <option value="grok-4-3">grok-4-3</option>
      <option value="gemini-3-5-flash">gemini-3-5-flash</option>
      <option value="claude-opus-4-8">claude-opus-4-8</option>
      <option value="qwen3-coder-480b-a35b-instruct-turbo">qwen3-coder-480b-a35b-instruct-turbo</option>
    </select>
  </div>

  <div class="sidebar-section">
    <span class="sidebar-label">Max Steps</span>
    <div class="range-row">
      <input type="range" id="max-steps" min="5" max="50" value="20" />
      <span id="max-steps-val">20</span>
    </div>
  </div>

  <button id="btn-new">＋ New Task</button>
</aside>

<!-- Main -->
<main id="main">

  <!-- Topbar -->
  <header id="topbar">
    <span id="app-title">Vigil</span>
    <nav id="tabs">
      <button class="tab active" data-tab="queue">
        Queue <span class="tab-badge" id="count-queue">0</span>
      </button>
      <button class="tab" data-tab="running">
        Running <span class="tab-badge" id="count-running">0</span>
      </button>
      <button class="tab" data-tab="done">
        Done <span class="tab-badge" id="count-done">0</span>
      </button>
      <button class="tab" data-tab="failed">
        Failed <span class="tab-badge" id="count-failed">0</span>
      </button>
    </nav>
  </header>

  <!-- Card panes (one per status, only active is visible) -->
  <div id="card-area">
    <div class="tab-pane active" id="body-queue"   data-status="queue"></div>
    <div class="tab-pane"        id="body-running" data-status="running"></div>
    <div class="tab-pane"        id="body-done"    data-status="done"></div>
    <div class="tab-pane"        id="body-failed"  data-status="failed"></div>
  </div>

</main>

<!-- New Task Modal -->
<div id="modal-overlay">
  <div id="modal">
    <h2>New Task</h2>
    <textarea id="task-input" placeholder="Describe what the browser should do…" autofocus></textarea>
    <div class="modal-row">
      <div class="modal-field">
        <label>Model</label>
        <select id="modal-model">
          <option value="grok-4-3">grok-4-3</option>
          <option value="gemini-3-5-flash">gemini-3-5-flash</option>
          <option value="claude-opus-4-8">claude-opus-4-8</option>
          <option value="qwen3-coder-480b-a35b-instruct-turbo">qwen3-coder-480b-a35b-instruct-turbo</option>
        </select>
      </div>
      <div class="modal-field">
        <label>Max Steps</label>
        <select id="modal-steps">
          <option value="10">10</option>
          <option value="20" selected>20</option>
          <option value="30">30</option>
          <option value="50">50</option>
        </select>
      </div>
    </div>
    <div class="modal-actions">
      <span class="modal-hint">⌘↵ to run</span>
      <button class="btn-ghost" id="btn-cancel">Cancel</button>
      <button class="btn-accent" id="btn-submit">Run Task</button>
    </div>
  </div>
</div>

<!-- Detail Panel -->
<div id="detail-panel">
  <div id="detail-header">
    <span id="detail-id">—</span>
    <span id="detail-title" class="badge-queue"></span>
    <button id="detail-close">✕</button>
  </div>
  <div id="detail-body">
    <div>
      <div class="detail-label">Task</div>
      <div id="detail-desc"></div>
    </div>
    <div id="live-browser">
      <div class="detail-label">Live Browser</div>
      <div class="browser-inset">
        <img id="live-screenshot" alt="browser view" />
        <p id="no-screenshot">waiting for screenshot…</p>
      </div>
    </div>
    <div>
      <div class="detail-label">History</div>
      <div id="detail-history"></div>
    </div>
    <div id="detail-error"></div>
  </div>
  <div id="detail-actions">
    <button id="btn-stop">Stop</button>
    <button id="btn-retry">Retry</button>
  </div>
</div>

<script>
const socket = io();

// ── State ──────────────────────────────────────────────────
const taskMap    = {};
let activeTaskId = null;
let activeTab    = 'queue';
let elapsedTimers = {};

// ── Socket events ──────────────────────────────────────────
socket.on('connect', () => { socket.emit('get_all_tasks'); });

socket.on('all_tasks', (tasks) => {
  tasks.forEach(t => applyTask(t));
  updateCounts();
});

socket.on('task_update', (task) => {
  applyTask(task);
  updateCounts();
  if (activeTaskId === task.id) renderDetail(task);
});

socket.on('screenshot_update', (data) => {
  if (activeTaskId === data.id) {
    const img = document.getElementById('live-screenshot');
    const placeholder = document.getElementById('no-screenshot');
    img.src = 'data:image/png;base64,' + data.screenshot;
    img.style.display = 'block';
    placeholder.style.display = 'none';
  }
});

// ── Tab switching ──────────────────────────────────────────
function setActiveTab(tab) {
  activeTab = tab;
  document.querySelectorAll('.tab').forEach(btn =>
    btn.classList.toggle('active', btn.dataset.tab === tab)
  );
  document.querySelectorAll('.tab-pane').forEach(pane =>
    pane.classList.toggle('active', pane.id === 'body-' + tab)
  );
}

document.querySelectorAll('.tab').forEach(btn =>
  btn.addEventListener('click', () => setActiveTab(btn.dataset.tab))
);

// ── Task state management ──────────────────────────────────
function applyTask(task) {
  taskMap[task.id] = task;

  const card = document.getElementById('card-' + task.id);
  if (card) {
    const pane = card.closest('.tab-pane');
    if (pane && pane.id === 'body-' + task.status) {
      updateCard(card, task);
      return;
    }
    card.remove();
  }

  if (task.status !== 'running') stopTimer(task.id);

  const newCard = buildCard(task);
  const body = document.getElementById('body-' + task.status);
  if (body) {
    const empty = body.querySelector('.empty-state');
    if (empty) empty.remove();
    body.prepend(newCard);
  }

  if (task.status === 'running') startTimer(task.id);
  updateCounts();
}

// ── Card building ──────────────────────────────────────────
function buildCard(task) {
  const div = document.createElement('div');
  div.className = 'card';
  div.id = 'card-' + task.id;
  div.dataset.status = task.status;
  div.innerHTML = cardHTML(task);
  div.addEventListener('click', () => openDetail(task.id));
  setupDrag(div, task);
  return div;
}

function updateCard(card, task) {
  card.dataset.status = task.status;
  card.innerHTML = cardHTML(task);
  card.onclick = () => openDetail(task.id);
  setupDrag(card, task);
  if (task.status === 'running') startTimer(task.id);
  else stopTimer(task.id);
}

function cardHTML(task) {
  const lastStep = task.steps && task.steps.length > 0
    ? task.steps[task.steps.length - 1] : null;
  const logText  = lastStep ? JSON.stringify(lastStep.action).slice(0, 88) : null;
  const elapsed  = task.elapsed ? task.elapsed + 's' : '';
  const showSteps = task.status === 'running' || task.status === 'done';
  const stepLabel = showSteps ? `${task.step}/${task.total_steps}` : '';
  const pct = (task.status === 'running' && task.total_steps > 0)
    ? Math.min(100, Math.round(task.step / task.total_steps * 100)) : null;

  return `
    <div class="card-desc">${escHtml(task.description)}</div>
    <div class="card-meta">
      <span class="card-model">${escHtml(task.model)}</span>
      ${stepLabel ? `<span class="card-steps">${stepLabel}</span>` : ''}
      <span class="card-elapsed-inline" id="elapsed-${task.id}">${elapsed}</span>
    </div>
    ${logText ? `<div class="card-log">${escHtml(logText)}</div>` : ''}
    ${pct !== null ? `<div class="card-progress" style="width:${pct}%"></div>` : ''}
  `;
}

// ── Elapsed timers ─────────────────────────────────────────
function startTimer(id) {
  if (elapsedTimers[id]) return;
  const task = taskMap[id];
  if (!task || !task.started_at) return;
  elapsedTimers[id] = setInterval(() => {
    const el = document.getElementById('elapsed-' + id);
    if (el) el.textContent = Math.round(Date.now() / 1000 - task.started_at) + 's';
  }, 1000);
}

function stopTimer(id) {
  if (elapsedTimers[id]) { clearInterval(elapsedTimers[id]); delete elapsedTimers[id]; }
}

// ── Column counts + empty states ───────────────────────────
function updateCounts() {
  ['queue', 'running', 'done', 'failed'].forEach(s => {
    const count = Object.values(taskMap).filter(t => t.status === s).length;
    document.getElementById('count-' + s).textContent = count;

    const body  = document.getElementById('body-' + s);
    const cards = body.querySelectorAll('.card');
    if (cards.length === 0 && !body.querySelector('.empty-state')) {
      const e = document.createElement('div');
      e.className = 'empty-state';
      e.textContent = 'empty';
      body.appendChild(e);
    } else if (cards.length > 0) {
      const e = body.querySelector('.empty-state');
      if (e) e.remove();
    }
  });
}

// ── Drag & Drop ────────────────────────────────────────────
let dragId = null;

function setupDrag(card, task) {
  if (task.status !== 'queue' && task.status !== 'failed') {
    card.draggable = false;
    return;
  }
  card.draggable = true;
  card.addEventListener('dragstart', () => {
    dragId = task.id;
    setTimeout(() => card.classList.add('dragging'), 0);
  });
  card.addEventListener('dragend', () => {
    card.classList.remove('dragging');
    dragId = null;
  });
}

document.querySelectorAll('.tab-pane').forEach(pane => {
  pane.addEventListener('dragover',  e => { e.preventDefault(); pane.classList.add('drop-over'); });
  pane.addEventListener('dragleave', ()  => pane.classList.remove('drop-over'));
  pane.addEventListener('drop', e => {
    e.preventDefault();
    pane.classList.remove('drop-over');
    if (!dragId || pane.dataset.status !== 'queue') return;
    socket.emit('retry_task', { id: dragId });
  });
});

// ── Detail Panel ───────────────────────────────────────────
function openDetail(id) {
  activeTaskId = id;
  const task = taskMap[id];
  if (!task) return;
  renderDetail(task);
  document.getElementById('detail-panel').classList.add('open');
}

function closeDetail() {
  activeTaskId = null;
  document.getElementById('detail-panel').classList.remove('open');
}

function renderDetail(task) {
  document.getElementById('detail-id').textContent = '#' + task.id;

  const badge = document.getElementById('detail-title');
  badge.textContent = task.status;
  badge.className = 'badge-' + task.status;

  document.getElementById('detail-desc').textContent = task.description;

  const img = document.getElementById('live-screenshot');
  const placeholder = document.getElementById('no-screenshot');
  if (task.screenshot) {
    img.src = 'data:image/png;base64,' + task.screenshot;
    img.style.display = 'block';
    placeholder.style.display = 'none';
  } else {
    img.style.display = 'none';
    placeholder.style.display = 'block';
  }

  const hist = document.getElementById('detail-history');
  hist.innerHTML = '';
  if (task.steps && task.steps.length > 0) {
    task.steps.forEach(s => {
      const row = document.createElement('div');
      row.className = 'history-row';
      row.innerHTML = `<span class="history-time">${s.time}s</span><span class="history-action">${escHtml(JSON.stringify(s.action))}</span>`;
      hist.appendChild(row);
    });
    hist.scrollTop = hist.scrollHeight;
  }

  const errEl = document.getElementById('detail-error');
  if (task.error) {
    errEl.textContent = '⚠ ' + task.error;
    errEl.style.display = 'block';
  } else {
    errEl.style.display = 'none';
  }

  document.getElementById('btn-stop').style.display  = task.status === 'running' ? 'inline-block' : 'none';
  document.getElementById('btn-retry').style.display = task.status === 'failed'  ? 'inline-block' : 'none';
}

document.getElementById('detail-close').addEventListener('click', closeDetail);
document.getElementById('btn-stop').addEventListener('click', () => {
  if (activeTaskId) socket.emit('stop_task', { id: activeTaskId });
});
document.getElementById('btn-retry').addEventListener('click', () => {
  if (activeTaskId) { socket.emit('retry_task', { id: activeTaskId }); closeDetail(); }
});

// ── Sidebar controls ───────────────────────────────────────
const stepsSlider = document.getElementById('max-steps');
const stepsVal    = document.getElementById('max-steps-val');
stepsSlider.addEventListener('input', () => {
  stepsVal.textContent = stepsSlider.value;
  const v   = parseInt(stepsSlider.value);
  const opt = [...document.getElementById('modal-steps').options]
    .reduce((p, c) => Math.abs(parseInt(c.value) - v) < Math.abs(parseInt(p.value) - v) ? c : p);
  document.getElementById('modal-steps').value = opt.value;
});

const sidebarModel = document.getElementById('model-select');
sidebarModel.addEventListener('change', () => {
  document.getElementById('modal-model').value = sidebarModel.value;
});

// ── Modal ──────────────────────────────────────────────────
const overlay = document.getElementById('modal-overlay');

function openModal() {
  document.getElementById('modal-model').value = sidebarModel.value;
  document.getElementById('task-input').value  = '';
  overlay.classList.add('open');
  setTimeout(() => document.getElementById('task-input').focus(), 50);
}
function closeModal() { overlay.classList.remove('open'); }

document.getElementById('btn-new').addEventListener('click', openModal);
document.getElementById('btn-cancel').addEventListener('click', closeModal);
overlay.addEventListener('click', e => { if (e.target === overlay) closeModal(); });
document.getElementById('task-input').addEventListener('keydown', e => {
  if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) submitTask();
});
document.getElementById('btn-submit').addEventListener('click', submitTask);

function submitTask() {
  const task      = document.getElementById('task-input').value.trim();
  if (!task) return;
  const model     = document.getElementById('modal-model').value;
  const max_steps = parseInt(document.getElementById('modal-steps').value);
  socket.emit('create_task', { task, model, max_steps });
  closeModal();
}

// ── Keyboard shortcuts ─────────────────────────────────────
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { closeModal(); closeDetail(); }
  if (e.key === 'n' && !e.metaKey && !e.ctrlKey &&
      e.target.tagName !== 'TEXTAREA' && e.target.tagName !== 'INPUT') openModal();
});

// ── Helpers ────────────────────────────────────────────────
function escHtml(str) {
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

// ── Init ───────────────────────────────────────────────────
updateCounts();
</script>
</body>
</html>
